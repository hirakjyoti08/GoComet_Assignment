# Render Blueprint: managed PostgreSQL + horizontally scaled web service.
databases:
  - name: auction-db
    plan: basic-256mb
    postgresMajorVersion: "16"

services:
  - type: web
    name: british-auction-rfq
    runtime: docker
    plan: starter
    numInstances: 2
    healthCheckPath: /api/ready
    preDeployCommand: node scripts/migrate.js
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: auction-db, property: connectionString }
      - key: MIGRATE_ON_START
        value: "false"
      - key: SECURE_COOKIES
        value: "true"
