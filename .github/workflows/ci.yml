# CI: every push to main and every pull request.
#
#   backend (Node 22 + 24) ─┐
#   backend-postgres ───────┼──► e2e (Playwright) ──► docker (compose: Postgres + 2 instances + nginx)
#   frontend ───────────────┘
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend unit + API (embedded Postgres, Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Tests with coverage thresholds (lines 85 / branches 80 / functions 85)
        run: npm run test:coverage
      - uses: actions/upload-artifact@v4
        if: matrix.node == 24
        with:
          name: backend-coverage
          path: backend/coverage/lcov.info

  backend-postgres:
    name: Backend on real PostgreSQL 16 (locking, leadership, NOTIFY)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: auction
          POSTGRES_PASSWORD: auction
          POSTGRES_DB: auction_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U auction -d auction_test"
          --health-interval 2s --health-timeout 3s --health-retries 30
    defaults:
      run:
        working-directory: backend
    env:
      TEST_DATABASE_URL: postgres://auction:auction@localhost:5432/auction_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run test:pg

  frontend:
    name: Frontend unit tests + build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json
      - run: npm ci
      # format.test.js imports backend/src/rules.js to pin UI logic to the server's rules (no deps needed).
      - run: npm run test:coverage
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

  e2e:
    name: End-to-end (Playwright, Chromium)
    needs: [backend, backend-postgres, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
            e2e/package-lock.json
      - run: npm ci --prefix backend
      - run: npm ci --prefix frontend
      - run: npm ci --prefix e2e
      - name: Install Chromium
        run: npx --prefix e2e playwright install --with-deps chromium
      - name: Run E2E (builds the frontend and starts the real server on in-memory Postgres)
        working-directory: e2e
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7

  docker:
    name: Docker Compose smoke test (Postgres + 2 instances + nginx)
    needs: [e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RATE_LIMIT_ENABLED: "false" # the load check registers many users from one IP
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build and start the stack
        run: docker compose up -d --build
      - name: Wait for the load balancer to report ready
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/api/ready; then echo; exit 0; fi
            sleep 2
          done
          echo "stack did not become ready"; exit 1
      - name: Both app instances serve traffic through the load balancer
        run: |
          seen=$(for i in $(seq 1 20); do curl -fsSI http://localhost:8080/api/health | grep -i '^x-instance:'; done | sort -u | wc -l)
          echo "distinct instances behind LB: $seen"
          test "$seen" -ge 2
      - name: Concurrent bids across instances lose no updates
        run: BASES=http://localhost:8080 SUPPLIERS=30 node backend/scripts/concurrent-bids.js
      - name: Seed demo data and fetch the SPA
        run: |
          docker compose run --rm seed
          curl -fsS http://localhost:8080/ | grep -q '<div id="root">'
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200
      - name: Tear down
        if: always()
        run: docker compose down -v
