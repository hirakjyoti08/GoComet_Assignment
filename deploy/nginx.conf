# Load balancer in front of N app instances. Any instance can serve any request:
# sessions live in PostgreSQL, live updates fan out via LISTEN/NOTIFY.
resolver 127.0.0.11 valid=10s ipv6=off;   # Docker DNS, so scaled replicas are picked up

upstream app {
  least_conn;               # long-lived SSE connections → balance by open connections
  zone app 64k;
  server app:4000 resolve;
}

server {
  listen 80;
  client_max_body_size 200k;

  proxy_http_version 1.1;
  proxy_set_header Host              $host;
  proxy_set_header X-Real-IP         $remote_addr;
  proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Request-Id      $request_id;   # one id across LB + app logs

  # Server-Sent Events: no buffering, long read timeout, keep the connection open.
  location = /api/events {
    proxy_pass http://app;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
  }

  location / {
    proxy_pass http://app;
    proxy_set_header Connection "";
    proxy_next_upstream error timeout http_502 http_503;  # retry idempotent requests on another instance
  }
}
